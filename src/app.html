<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Apply theme before first paint: stored choice, else system preference -->
	<script>
		(function () {
			try {
				var stored = localStorage.getItem('samizdata-theme');
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		})();
	</script>
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf9f4" />
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111311" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
